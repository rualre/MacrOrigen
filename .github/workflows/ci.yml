name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  calidad:
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: macrorigen-ci-secret-de-al-menos-32-caracteres
      DATABASE_URL: postgresql://ci:ci@localhost:5432/macrorigen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run build
